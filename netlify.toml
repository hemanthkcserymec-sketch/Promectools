[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/aquaforceforautocare"
  to = "https://aquaforceforautocare.netlify.app/aquaforceforautocare"
  status = 200
  force = true

[[redirects]]
  from = "/aquaforceforautocare/*"
  to = "https://aquaforceforautocare.netlify.app/aquaforceforautocare/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://aquaforceforautocare.netlify.app/aquaforceforautocare/api/:splat"
  status = 200
  force = true
